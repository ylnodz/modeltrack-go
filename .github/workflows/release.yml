name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Build static linux/amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/modeltrack-linux-amd64 ./cmd/modeltrack
          sha256sum dist/modeltrack-linux-amd64 > dist/modeltrack-linux-amd64.sha256
          file dist/modeltrack-linux-amd64
          ls -lh dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/modeltrack-linux-amd64
            dist/modeltrack-linux-amd64.sha256
